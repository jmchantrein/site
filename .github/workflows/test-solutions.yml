# Test E2E des corrigés (construit/teste les fichiers de
# site/src/solutions/ — exactement ceux que les cours affichent via <CodeFile>).
# Indépendant du déploiement Pages : il a besoin de Docker (présent sur
# ubuntu-latest) et n'est PAS déclenché par les pushs ordinaires.
name: Tester les corrigés

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Niveau de test"
        type: choice
        options: [lint, build, up]
        default: up
  push:
    paths:
      - "site/src/solutions/**"
      - "site/scripts/test-solutions.sh"
      - "site/scripts/test-solutions-yaml.sh"
      - "site/scripts/test-solutions-bash.sh"
      - "site/scripts/test-solutions-wireguard.sh"
      - "site/scripts/test-solutions-ansible.sh"
      - "site/scripts/test-solutions-kvm.sh"
      - "site/scripts/test-solutions-qt.sh"
      - ".github/workflows/test-solutions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # ubuntu-latest fournit déjà Docker Engine + le plugin docker compose v2.
      # Mode : choix du dispatch ; sinon `up` (smoke test HTTP complet) sur
      # main — le contrat « le code affiché est le code testé » est vérifié en
      # exécution réelle à chaque changement livré — et `build` sur les autres
      # branches (plus rapide en itération).
      - name: Corrigés Docker (TP WordPress + images)
        working-directory: site
        run: bash scripts/test-solutions.sh "--${{ github.event.inputs.mode || (github.ref == 'refs/heads/main' && 'up' || 'build') }}"
      # Corrigés YAML et Bash/sed-awk (série Outils) — rapides, sans Docker.
      - name: Outils des harnais frères (yamllint, yq, shellcheck, bats, xmllint, tmux)
        run: sudo apt-get update -q && sudo apt-get install -y -q yamllint yq shellcheck bats libxml2-utils tmux
      - name: Corrigés YAML (module YAML & JSON)
        working-directory: site
        run: bash scripts/test-solutions-yaml.sh --up
      - name: Corrigés Bash, sed/awk et Git (série Outils)
        working-directory: site
        run: bash scripts/test-solutions-bash.sh --up
      # Série KVM : les VM exigeraient la virtualisation imbriquée (hors de
      # portée ici) — on valide scripts (shellcheck) et XML libvirt (xmllint).
      - name: Corrigés KVM (scripts hôte + XML libvirt)
        working-directory: site
        run: bash scripts/test-solutions-kvm.sh
      # Série Qt 6 : compilation CMake/AUTOMOC des 8 exemples, exécution des
      # exemples console (sorties vérifiées) et des interfaces en offscreen.
      - name: Corrigés Qt 6 (compilation + exécution offscreen)
        working-directory: site
        run: |
          sudo apt-get install -y -q qt6-base-dev
          bash scripts/test-solutions-qt.sh --up
      # Mini-labo WireGuard (module WireGuard) — tunnel chiffré entre deux
      # conteneurs, vérifié par un ping à travers le tunnel.
      - name: Mini-labo WireGuard (tunnel Docker)
        working-directory: site
        run: bash scripts/test-solutions-wireguard.sh
      # Labo Ansible (série Ansible) — lint + syntax-check, puis labo Docker
      # complet : les playbooks passent DEUX fois, le second doit dire
      # changed=0 — la CI incarne l'idempotence enseignée.
      # ansible-lint vient d'un venv dédié : le paquet apt (ansible-core
      # 2.16) entre en conflit avec l'ansible préinstallé du runner
      # (« Ansible CLI and python module versions do not match »).
      - name: Labo Ansible (lint + idempotence)
        working-directory: site
        run: |
          python3 -m venv /tmp/ansible-venv
          /tmp/ansible-venv/bin/pip install -q ansible-core ansible-lint
          export PATH="/tmp/ansible-venv/bin:$PATH"
          bash scripts/test-solutions-ansible.sh --up
