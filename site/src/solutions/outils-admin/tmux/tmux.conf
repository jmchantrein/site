# ~/.tmux.conf — a sober starter configuration, one habit per line.
# Reload from inside tmux:  prefix :  then  source-file ~/.tmux.conf

# The mouse works (select panes, resize, scroll) — heresy for some,
# a decent on-ramp for everyone.
set -g mouse on

# More scrollback than the stingy default (2000 lines).
set -g history-limit 50000

# Copy mode speaks vi (prefix [ then h/j/k/l, v to select, y to yank).
setw -g mode-keys vi

# Splits that say what they do: | vertical, - horizontal
# (the defaults % and " remain available).
bind | split-window -h
bind - split-window -v

# Windows and panes numbered from 1 (0 sits far away on the keyboard),
# and renumbered when one closes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# A discreet status bar: session name, centred window list, host + time.
set -g status-left "#[bold][#S] "
set -g status-justify centre
set -g status-right "#h · %H:%M"
