<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entraîner, puis inférer</title><style>
:root{--bg:#f7f8fa;--panel:#fff;--text:#17202a;--muted:#52606d;--line:#9aa6b2;--accent:#075f7a;--good:#176b3a;--warn:#8a4b08;--focus:#005fcc}*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px/1.45 system-ui,sans-serif;color:var(--text);background:var(--bg)}main{min-height:100%;padding:18px;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px}h1{font-size:1.18rem;margin:0}.lead,.status{margin:4px 0 0;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-weight:650;border:1px solid #647382;border-radius:6px;background:#fff;color:var(--text);padding:8px 12px;cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}button.reset{margin-left:auto}.scene{display:grid;grid-template-columns:minmax(92px,1fr) minmax(180px,3fr) minmax(100px,1fr);gap:10px;align-items:center;background:var(--panel);border:1px solid #c8d0d8;border-radius:8px;padding:12px;min-height:250px}.box{text-align:center}.picture{font-size:3rem;border:2px solid var(--line);border-radius:8px;padding:8px;display:inline-block}.label{display:block;font-size:.8rem;color:var(--muted);margin-top:6px}svg{width:100%;height:210px}line{stroke:var(--line);stroke-width:1;opacity:.42}line.strong{stroke-width:3}line.neg{stroke-dasharray:5 4}circle{fill:#fff;stroke:var(--accent);stroke-width:2}text{font:11px system-ui;fill:var(--muted)}.score{font:700 1.35rem ui-monospace,monospace;color:var(--accent)}.explain{border-left:4px solid var(--accent);background:var(--panel);padding:10px 12px;min-height:48px}.stage-0 .picture,.stage-1 circle,.stage-2 .score,.stage-3 .picture{animation:pulse .65s ease}.stage-1 line{animation:flow 1.1s ease both}.stage-2 line{stroke:var(--warn)}.stage-3 line{stroke:var(--good)}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes flow{50%{stroke:var(--accent);opacity:1}}@media(max-width:520px){main{padding:12px}.scene{grid-template-columns:1fr;min-height:0}svg{height:160px}button.reset{margin-left:0}}@media(prefers-color-scheme:dark){:root{--bg:#101820;--panel:#17232d;--text:#f2f5f7;--muted:#bdc8d1;--line:#72818e;--accent:#69c4e0;--good:#79d398;--warn:#f0b66b;--focus:#8dc8ff}button,circle{background:var(--panel);fill:var(--panel);color:var(--text)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><main><header><h1>Entraîner, puis inférer</h1><p class="lead">Suivez une image étiquetée dans un petit réseau. L’entraînement ajuste les poids ; l’inférence les réutilise.</p></header><div class="controls" aria-label="Steps"><button data-step="0" type="button">1 · Donnée</button><button data-step="1" type="button">2 · Propager</button><button data-step="2" type="button">3 · Corriger</button><button data-step="3" type="button">4 · Inférer</button><button class="reset" type="button">Réinitialiser</button></div><section class="scene" aria-label="Entraîner, puis inférer"><div class="box"><div class="picture" aria-label="Entrée : chat étiqueté">🐈</div><b class="label">Entrée : chat étiqueté</b></div><div><b class="label">Couches cachées</b><svg viewBox="0 0 360 200" role="img" aria-label="Couches cachées"><g class="links"><line x1="35" y1="40" x2="150" y2="30" class="strong"/><line x1="35" y1="40" x2="150" y2="100"/><line x1="35" y1="100" x2="150" y2="30" class="neg"/><line x1="35" y1="100" x2="150" y2="100" class="strong"/><line x1="35" y1="160" x2="150" y2="170"/><line x1="150" y1="30" x2="265" y2="65" class="strong"/><line x1="150" y1="100" x2="265" y2="65"/><line x1="150" y1="100" x2="265" y2="140" class="neg"/><line x1="150" y1="170" x2="265" y2="140" class="strong"/><line x1="265" y1="65" x2="335" y2="100" class="strong"/><line x1="265" y1="140" x2="335" y2="100"/></g><g><circle cx="35" cy="40" r="11"/><circle cx="35" cy="100" r="11"/><circle cx="35" cy="160" r="11"/><circle cx="150" cy="30" r="12"/><circle cx="150" cy="100" r="12"/><circle cx="150" cy="170" r="12"/><circle cx="265" cy="65" r="13"/><circle cx="265" cy="140" r="13"/><circle cx="335" cy="100" r="14"/></g><text x="88" y="33">+0.8</text><text x="89" y="88">−0.3</text><text x="205" y="55">+1.2</text></svg></div><div class="box"><div class="score">? %</div><b class="label">Sortie</b></div></section><p class="explain" role="status" aria-live="polite">Choisissez « Donnée » pour commencer.</p></main><script>
const root=document.querySelector('main'),score=document.querySelector('.score'),explain=document.querySelector('.explain'),buttons=[...document.querySelectorAll('[data-step]')],texts=['L’image est convertie en nombres. Son étiquette indique que la réponse attendue est « chat ».', 'Les signaux traversent des connexions pondérées. Les traits épais contribuent davantage ; les signes + et − indiquent leur sens.', 'La prédiction à 58 % est comparée à la réponse attendue. L’entraînement réduit l’erreur en ajustant les poids.', 'Avec les poids désormais fixés, une nouvelle image produit une prédiction : c’est l’inférence, pas un nouvel apprentissage.'];function show(n){root.className='stage-'+n;buttons.forEach((b,i)=>b.setAttribute('aria-pressed',i===n));explain.textContent=texts[n];score.textContent=n<1?'? %':n<2?'58 %':n<3?'87 %':'91 %'}buttons.forEach((b,i)=>b.addEventListener('click',()=>show(i)));document.querySelector('.reset').addEventListener('click',()=>{root.className='';score.textContent='? %';explain.textContent='Choisissez « Donnée » pour commencer.';buttons.forEach(b=>b.setAttribute('aria-pressed','false'))});</script></body></html>
